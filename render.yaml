services:
  - type: web
    name: mediconnect-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 10000

databases:
  - name: mediconnect-db
    databaseName: mediconnect
    user: mediconnect_user
    plan: free
    region: oregon
